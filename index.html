<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H2H INTEL</title>
<style>
  :root {
    --bg: #080810;
    --card: #0f0f1a;
    --border: #1a1a2e;
    --accent: #c8f135;
    --muted: #4a4a6a;
    --text: #e8e8f0;
    --dim: #7777aa;
    --green: #39ff88;
    --red: #ff3355;
    --yellow: #ffcc00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
  }
  #header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #logo {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 4px;
    color: var(--accent);
  }
  #status {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  #status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #status-dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }
  #tabs {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 20px;
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 12px 18px;
    transition: color 0.2s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  #body { padding: 20px; max-width: 860px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .section-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .search-wrap { position: relative; }
  .search-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    outline: none;
    padding: 10px 14px;
    width: 100%;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .dropdown {
    background: var(--card);
    border: 1px solid var(--accent);
    border-top: none;
    border-radius: 0 0 4px 4px;
    display: none;
    max-height: 200px;
    overflow-y: auto;
    position: absolute;
    width: 100%;
    z-index: 100;
  }
  .dropdown.open { display: block; }
  .drop-item {
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 10px 14px;
  }
  .drop-item:hover { background: var(--border); color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .gamer-name {
    color: var(--accent);
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    margin: 14px 0 10px;
  }
  .big-num {
    color: var(--accent);
    font-size: 34px;
    font-weight: bold;
    letter-spacing: -1px;
  }
  .stat-row {
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
  }
  .stat-label { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .stat-val { color: var(--accent); font-size: 13px; font-weight: bold; }
  .form-dots { margin: 8px 0; }
  .dot {
    border-radius: 50%;
    display: inline-block;
    height: 10px;
    margin: 0 2px;
    width: 10px;
  }
  .dot.W { background: var(--green); box-shadow: 0 0 4px var(--green); }
  .dot.L { background: var(--red); box-shadow: 0 0 4px var(--red); }
  .dot.Q { background: var(--muted); }
  .verdict {
    border-radius: 4px;
    margin-top: 14px;
    padding: 16px 18px;
  }
  .verdict-title {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .verdict-line { color: var(--dim); font-size: 13px; line-height: 1.7; }
  .tag {
    border-radius: 2px;
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1px;
    margin-right: 6px;
    padding: 2px 7px;
  }
  .log-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 500px) { .log-grid { grid-template-columns: 1fr; } }
  .log-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    outline: none;
    padding: 8px 12px;
    width: 100%;
  }
  .btn {
    background: transparent;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 10px 20px;
    transition: background 0.2s;
  }
  .btn-accent {
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .btn-accent:hover { background: rgba(200,241,53,0.1); }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 14px; text-align: center; }
  .loading { color: var(--muted); font-size: 12px; letter-spacing: 2px; padding: 30px 0; text-align: center; }
  .error-msg { color: var(--red); font-size: 13px; letter-spacing: 2px; padding: 40px 0; text-align: center; }
  .log-entry {
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
    padding: 10px 0;
  }
  .log-entry-left { font-size: 13px; }
  .log-entry-date { color: var(--muted); font-size: 11px; margin-left: 8px; }
</style>
</head>
<body>

<div id="header">
  <div id="logo">H2H INTEL</div>
  <div id="status">
    <div id="status-dot"></div>
    <span id="status-text">CONNECTING...</span>
  </div>
</div>

<div id="tabs">
  <button class="tab-btn active" onclick="switchTab('matchup')">MATCHUP</button>
  <button class="tab-btn" onclick="switchTab('lookup')">LOOKUP</button>
  <button class="tab-btn" onclick="switchTab('log')">LOG</button>
</div>

<div id="body">

  <!-- MATCHUP TAB -->
  <div id="tab-matchup" class="tab-panel active">
    <div class="section-title">MATCHUP ANALYSIS</div>
    <div class="grid2">
      <div class="card">
        <div class="label">GAMER A</div>
        <div class="search-wrap">
          <input class="search-input" id="inputA" placeholder="TYPE TO SEARCH..." autocomplete="off" />
          <div class="dropdown" id="dropA"></div>
        </div>
        <div id="statsA"></div>
      </div>
      <div class="card">
        <div class="label">GAMER B</div>
        <div class="search-wrap">
          <input class="search-input" id="inputB" placeholder="TYPE TO SEARCH..." autocomplete="off" />
          <div class="dropdown" id="dropB"></div>
        </div>
        <div id="statsB"></div>
      </div>
    </div>
    <div id="line-input-section" style="display:none;margin-bottom:12px">
      <div class="card" style="padding:14px">
        <div class="label">HARD ROCK LINE</div>
        <div style="display:flex;gap:10px;align-items:center">
          <input class="search-input" id="hrLine" type="number" placeholder="e.g. 108.5" step="0.5"
            oninput="analyzeeLine()" style="font-size:18px;font-weight:bold;max-width:160px" />
          <div id="line-verdict" style="flex:1"></div>
        </div>
      </div>
    </div>
    <div id="verdict"></div>
  </div>

  <!-- LOOKUP TAB -->
  <div id="tab-lookup" class="tab-panel">
    <div class="section-title">GAMER LOOKUP</div>
    <div class="card">
      <div class="label">SEARCH GAMER</div>
      <div class="search-wrap">
        <input class="search-input" id="inputLookup" placeholder="TYPE NAME..." autocomplete="off" />
        <div class="dropdown" id="dropLookup"></div>
      </div>
    </div>
    <div id="statsLookup"></div>
  </div>

  <!-- LOG TAB -->
  <div id="tab-log" class="tab-panel">
    <div class="section-title">BET LOG</div>
    <div class="stats-grid" id="log-summary"></div>
    <div class="card">
      <div class="section-title">LOG NEW BET</div>
      <div class="log-grid">
        <div><div class="label">GAMER A</div><input class="log-input" id="logA" placeholder="NAME..." /></div>
        <div><div class="label">GAMER B</div><input class="log-input" id="logB" placeholder="NAME..." /></div>
        <div id="line-field-wrap"><div class="label">LINE</div><input class="log-input" id="logLine" placeholder="e.g. 118.5" type="number" /></div>
        <div><div class="label">BET</div>
          <select class="log-input" id="logBet" onchange="toggleMoneylinePick(this.value)"><option>OVER</option><option>UNDER</option><option>MONEYLINE</option></select>
        </div>
        <div id="moneyline-pick-wrap" style="display:none"><div class="label">PLAYER PICKED</div><input class="log-input" id="logPick" placeholder="e.g. JACKAL" /></div>
        <div><div class="label">WAGER ($)</div><input class="log-input" id="logWager" placeholder="e.g. 10.00" type="number" step="0.01" /></div>
        <div><div class="label">PAYOUT ($)</div><input class="log-input" id="logPayout" placeholder="e.g. 16.67" type="number" step="0.01" /></div>
        <div><div class="label">RESULT</div>
          <select class="log-input" id="logResult"><option>WIN</option><option>LOSS</option><option>PENDING</option><option>CASHED OUT</option></select>
        </div>
        <div><div class="label">NOTES</div><input class="log-input" id="logNotes" placeholder="optional..." /></div>
      </div>
      <button class="btn btn-accent" onclick="addLog()">+ ADD TO LOG</button>
    </div>
    <div style="margin-bottom:12px">
      <input class="log-input" id="logSearch" placeholder="SEARCH GAMER..." oninput="renderLogHistory()" style="width:100%" />
    </div>
    <div id="log-history"></div>
  </div>

</div>

<script>
const PROXY = 'https://h2h-proxy.onrender.com';
let allNames = [];
let dataA = null, dataB = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(`${PROXY}/names`);
    const data = await res.json();
    allNames = Array.isArray(data)
      ? data.map(n => typeof n === 'string' ? n : (n.participantName || n.name || '')).filter(Boolean)
      : [];
    setStatus(true, `LIVE · ${allNames.length} GAMERS`);
    setupSearch('inputA', 'dropA', name => loadStats(name, 'A'));
    setupSearch('inputB', 'dropB', name => loadStats(name, 'B'));
    setupSearch('inputLookup', 'dropLookup', name => loadLookup(name));
  } catch(e) {
    setStatus(false, 'OFFLINE — PROXY DOWN');
  }
  renderLogSummary();
  renderLogHistory();
}

function setStatus(online, text) {
  const dot = document.getElementById('status-dot');
  dot.className = online ? 'online' : 'offline';
  document.getElementById('status-text').textContent = text;
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function setupSearch(inputId, dropId, onSelect) {
  const input = document.getElementById(inputId);
  const drop = document.getElementById(dropId);

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    if (!q) { drop.classList.remove('open'); return; }
    const matches = allNames.filter(n => n.toLowerCase().includes(q)).slice(0, 20);
    drop.innerHTML = matches.map(n =>
      `<div class="drop-item" onmousedown="selectItem('${inputId}','${dropId}','${n.replace(/'/g,"\\'")}', event)">${n}</div>`
    ).join('');
    drop.classList.toggle('open', matches.length > 0);
  });

  input.addEventListener('blur', () => setTimeout(() => drop.classList.remove('open'), 200));
}

function selectItem(inputId, dropId, name, e) {
  e.preventDefault();
  document.getElementById(inputId).value = name;
  document.getElementById(dropId).classList.remove('open');
  // figure out which callback
  if (inputId === 'inputA') loadStats(name, 'A');
  else if (inputId === 'inputB') loadStats(name, 'B');
  else if (inputId === 'inputLookup') loadLookup(name);
}

// ── STATS ─────────────────────────────────────────────────────────────────────
async function fetchStats(name) {
  const res = await fetch(`${PROXY}/stats?participant=${encodeURIComponent(name)}`);
  return res.json();
}

function mapStats(raw) {
  // matchForm can be an array ["w","l",...] or a string
  let formStr = '';
  if (Array.isArray(raw.matchForm)) {
    formStr = raw.matchForm.map(c => c.toUpperCase()).join('');
  } else if (typeof raw.matchForm === 'string') {
    formStr = raw.matchForm.toUpperCase();
  }
  return {
    name: raw.participantName || '?',
    ppg:   +(raw.avgPoints ?? 0).toFixed(1),
    fg:    +(raw.avgFieldGoalsPercent ?? 0).toFixed(1),
    tp:    +(raw.threePointersPercent ?? raw.avgThreePointers ?? 0).toFixed(1),
    ft:    +(raw.freeThrowsPercent ?? raw.avgFreeThrowsScored ?? 0).toFixed(1),
    fb:    +(raw.avgFastBreakPoints ?? 0).toFixed(1),
    paint: +(raw.avgPointsInThePaint ?? 0).toFixed(1),
    to:    +(raw.avgTurnovers ?? 0).toFixed(1),
    win:   +(raw.matchesWinPct ?? 0).toFixed(1),
    games: raw.matchesPlayed ?? 0,
    assists: +(raw.avgAssists ?? 0).toFixed(1),
    dunks:   +(raw.avgDunks ?? 0).toFixed(1),
    blocks:  +(raw.avgBlocks ?? 0).toFixed(1),
    steals:  +(raw.avgSteals ?? 0).toFixed(1),
    defReb:  +(raw.avgDefensiveRebounds ?? 0).toFixed(1),
    offReb:  +(raw.avgOffensiveRebounds ?? 0).toFixed(1),
    ptsAgainst: +(raw.pointsAgainst && raw.matchesPlayed ? raw.pointsAgainst / raw.matchesPlayed : 0).toFixed(1),
    ptDiff:  +(raw.pointDifference && raw.matchesPlayed ? raw.pointDifference / raw.matchesPlayed : raw.avgPointDifference ?? 0).toFixed(1),
    form:  formStr,
  };
}

function renderStats(stats) {
  const formArr = stats.form ? stats.form.split('').slice(0, 10) : [];
  const dots = formArr.map(c =>
    `<span class="dot ${c === 'W' ? 'W' : c === 'L' ? 'L' : 'Q'}"></span>`
  ).join('');
  return `
    <div class="gamer-name">${stats.name}</div>
    <div class="big-num">${stats.ppg}</div>
    <div class="label" style="margin-top:2px">PPG AVG</div>
    <div class="form-dots">${dots}${formArr.length > 0 ? `<span style="color:var(--muted);font-size:10px;margin-left:6px">LAST ${formArr.length}</span>` : ''}</div>
    ${[
      ['FG%', stats.fg+'%'],['3PT%', stats.tp+'%'],['FT%', stats.ft+'%'],
      ['FAST BREAK', stats.fb],['PAINT PTS', stats.paint],['TURNOVERS', stats.to],
      ['ASSISTS', stats.assists],['DUNKS', stats.dunks],
      ['BLOCKS', stats.blocks],['STEALS', stats.steals],
      ['DEF REB', stats.defReb],['OFF REB', stats.offReb],
      ['PTS ALLOWED', stats.ptsAgainst],['PT DIFF', stats.ptDiff],
      ['WIN%', stats.win+'%'],['GAMES', stats.games]
    ].map(([l,v]) => `<div class="stat-row"><span class="stat-label">${l}</span><span class="stat-val">${v}</span></div>`).join('')}
  `;
}

async function loadStats(name, side) {
  const el = document.getElementById('stats' + side);
  el.innerHTML = '<div class="loading">LOADING...</div>';
  try {
    const raw = await fetchStats(name);
    const stats = mapStats(raw);
    if (side === 'A') dataA = stats;
    else dataB = stats;
    el.innerHTML = renderStats(stats);
    renderVerdict();
    if (dataA && dataB) document.getElementById('line-input-section').style.display = 'block';
  } catch {
    el.innerHTML = '<div style="color:var(--red);font-size:12px;margin-top:10px">FAILED TO LOAD</div>';
  }
}

async function loadLookup(name) {
  const el = document.getElementById('statsLookup');
  el.innerHTML = '<div class="loading">LOADING...</div>';
  try {
    const raw = await fetchStats(name);
    const stats = mapStats(raw);
    el.innerHTML = `<div class="card">${renderStats(stats)}</div>`;
  } catch {
    el.innerHTML = '<div class="error-msg">FAILED TO LOAD</div>';
  }
}

// ── VERDICT ───────────────────────────────────────────────────────────────────
function winPctToML(p) {
  if (p >= 50) return '-' + Math.round((p / (100 - p)) * 100);
  return '+' + Math.round(((100 - p) / p) * 100);
}

function getFormTrend(formStr) {
  // Returns scoring trend: positive = improving, negative = declining
  const arr = formStr.split('').slice(0, 10);
  const recent3 = arr.slice(0, 3).filter(c => c === 'W').length;
  const older3 = arr.slice(7, 10).filter(c => c === 'W').length;
  return recent3 - older3;
}

function getDefEdge(a, b) {
  // Who has the defensive edge
  const aDefScore = (a.steals * 2) + (a.blocks * 2) + a.defReb - (a.ptsAgainst * 0.1);
  const bDefScore = (b.steals * 2) + (b.blocks * 2) + b.defReb - (b.ptsAgainst * 0.1);
  const diff = aDefScore - bDefScore;
  if (Math.abs(diff) < 2) return null;
  return diff > 0 ? `${a.name} has defensive edge (${a.steals} STL, ${a.blocks} BLK, ${a.ptsAgainst} PTS allowed)` 
                  : `${b.name} has defensive edge (${b.steals} STL, ${b.blocks} BLK, ${b.ptsAgainst} PTS allowed)`;
}

function getConfidence(combined, lineDiff, formA, formB, winDiff) {
  let score = 50;
  // Combined avg distance from line
  if (Math.abs(lineDiff) > 12) score += 20;
  else if (Math.abs(lineDiff) > 7) score += 12;
  else if (Math.abs(lineDiff) > 3) score += 6;
  // Form alignment
  const aWins = formA.split('').slice(0,5).filter(c=>c==='W').length;
  const bWins = formB.split('').slice(0,5).filter(c=>c==='W').length;
  if (aWins >= 3 && bWins >= 3) score += 8; // both hot — over
  if (aWins <= 1 && bWins <= 1) score += 8; // both cold — under
  // Win% gap
  if (winDiff > 15) score += 7;
  return Math.min(score, 99);
}

function renderVerdict() {
  const el = document.getElementById('verdict');
  if (!dataA || !dataB) { el.innerHTML = ''; return; }
  const combined = dataA.ppg + dataB.ppg;
  const pace = (dataA.fb + dataB.fb) / 2;
  const paint = (dataA.paint + dataB.paint) / 2;
  const tos = dataA.to + dataB.to;

  // Win probability — weighted blend of win%, recent form, pt diff
  const aFormW = dataA.form.split('').slice(0,10).filter(c=>c==='W').length;
  const bFormW = dataB.form.split('').slice(0,10).filter(c=>c==='W').length;
  const aTrend = getFormTrend(dataA.form);
  const bTrend = getFormTrend(dataB.form);
  const aScore = (dataA.win * 0.6) + (aFormW * 3) + (dataA.ptDiff * 0.5) + (aTrend * 2);
  const bScore = (dataB.win * 0.6) + (bFormW * 3) + (dataB.ptDiff * 0.5) + (bTrend * 2);
  const aWinProb = Math.round((aScore / (aScore + bScore)) * 100);
  const bWinProb = 100 - aWinProb;
  const fav = aWinProb >= bWinProb ? dataA : dataB;
  const dog = aWinProb >= bWinProb ? dataB : dataA;
  const favProb = Math.max(aWinProb, bWinProb);
  const dogProb = Math.min(aWinProb, bWinProb);
  const winDiff = favProb - dogProb;
  const ppgDiff = Math.abs(dataA.ppg - dataB.ppg);
  const spreadEst = ((ppgDiff * 0.5) + (winDiff * 0.15)).toFixed(1);
  const favML = winPctToML(favProb);
  const dogML = winPctToML(dogProb);

  // Form trends
  const aTrendStr = aTrend > 0 ? '↑ HOT' : aTrend < 0 ? '↓ COLD' : '→ STEADY';
  const bTrendStr = bTrend > 0 ? '↑ HOT' : bTrend < 0 ? '↓ COLD' : '→ STEADY';
  const aTrendColor = aTrend > 0 ? 'var(--green)' : aTrend < 0 ? 'var(--red)' : 'var(--yellow)';
  const bTrendColor = bTrend > 0 ? 'var(--green)' : bTrend < 0 ? 'var(--red)' : 'var(--yellow)';

  // Defensive edge
  const defEdge = getDefEdge(dataA, dataB);

  // Line input confidence
  const lineEl = document.getElementById('hrLine');
  const line = lineEl ? parseFloat(lineEl.value) : NaN;
  const lineDiff = !isNaN(line) ? combined - line : 0;
  const confidence = !isNaN(line) ? getConfidence(combined, lineDiff, dataA.form, dataB.form, winDiff) : null;
  const confColor = confidence >= 70 ? 'var(--green)' : confidence >= 55 ? 'var(--yellow)' : 'var(--red)';

  let totalLabel, totalColor;
  if (combined >= 130)      { totalLabel = 'STRONG OVER';  totalColor = 'var(--green)'; }
  else if (combined >= 120) { totalLabel = 'LEAN OVER';    totalColor = 'var(--green)'; }
  else if (combined <= 105) { totalLabel = 'STRONG UNDER'; totalColor = 'var(--red)'; }
  else if (combined <= 112) { totalLabel = 'LEAN UNDER';   totalColor = 'var(--red)'; }
  else                      { totalLabel = 'NEUTRAL';       totalColor = 'var(--yellow)'; }

  const notes = [
    pace > 12 ? 'Fast break heavy — up-tempo pace expected' : null,
    paint > 38 ? 'Both attack the paint heavily — high FG% game expected' : null,
    tos > 16 ? 'High combined turnovers — pace disruption risk' : null,
    defEdge,
  ].filter(Boolean);

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      <div class="card" style="padding:14px">
        <div class="label">WIN PROBABILITY</div>
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:12px;color:var(--accent)">${dataA.name}</span>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:10px;color:${aTrendColor}">${aTrendStr}</span>
              <span style="font-size:14px;font-weight:bold;color:${aWinProb>=bWinProb?'var(--green)':'var(--text)'}">${aWinProb}%</span>
            </div>
          </div>
          <div style="background:var(--border);border-radius:2px;height:4px">
            <div style="background:var(--accent);height:4px;border-radius:2px;width:${aWinProb}%"></div>
          </div>
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:12px;color:var(--accent)">${dataB.name}</span>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:10px;color:${bTrendColor}">${bTrendStr}</span>
              <span style="font-size:14px;font-weight:bold;color:${bWinProb>aWinProb?'var(--green)':'var(--text)'}">${bWinProb}%</span>
            </div>
          </div>
          <div style="background:var(--border);border-radius:2px;height:4px">
            <div style="background:var(--accent);height:4px;border-radius:2px;width:${bWinProb}%"></div>
          </div>
        </div>
      </div>
      <div class="card" style="padding:14px">
        <div class="label">MONEYLINE / SPREAD</div>
        <div style="margin-bottom:10px">
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:2px">FAVORITE</div>
          <div style="font-size:14px;font-weight:bold;color:var(--green)">${fav.name}</div>
          <div style="font-size:13px;color:var(--text)">${favML} &nbsp;·&nbsp; -${spreadEst}</div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:2px">UNDERDOG</div>
          <div style="font-size:14px;font-weight:bold;color:var(--text)">${dog.name}</div>
          <div style="font-size:13px;color:var(--text)">${dogML} &nbsp;·&nbsp; +${spreadEst}</div>
        </div>
      </div>
    </div>
    ${confidence !== null ? `
    <div class="card" style="padding:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div class="label">CONFIDENCE SCORE</div>
        <div style="font-size:11px;color:var(--muted)">Based on avg gap, form, win%</div>
      </div>
      <div style="font-size:32px;font-weight:bold;color:${confColor}">${confidence}</div>
    </div>` : ''}
    <div class="verdict" style="background:${totalColor}11;border:1px solid ${totalColor}44">
      <div class="verdict-title" style="color:${totalColor}">▶ ${totalLabel}</div>
      <div class="verdict-line">· Combined avg output: ${combined.toFixed(1)} pts</div>
      ${notes.map(n => `<div class="verdict-line">· ${n}</div>`).join('')}
      <div style="color:var(--muted);font-size:11px;margin-top:10px">Always confirm with live line movement before placing.</div>
    </div>`;
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

// ── LOG ───────────────────────────────────────────────────────────────────────
function getLog() {
  try { return JSON.parse(localStorage.getItem('h2h_log') || '[]'); } catch { return []; }
}
function saveLog(log) { localStorage.setItem('h2h_log', JSON.stringify(log)); }

// addLog moved above renderLogHistory

function renderLogSummary() {
  const log = getLog();
  const wins = log.filter(l => l.result === 'WIN').length;
  const rate = log.length > 0 ? Math.round(wins / log.length * 100) : 0;
  const rateColor = rate >= 55 ? 'var(--green)' : rate >= 45 ? 'var(--yellow)' : 'var(--red)';
  
  // Calculate total profit/loss
  let totalPL = 0;
  log.forEach(e => {
    if ((e.result === 'WIN' || e.result === 'CASHED OUT') && e.payout && e.wager) totalPL += (e.payout - e.wager);
    else if (e.result === 'LOSS' && e.wager) totalPL -= e.wager;
  });
  const plColor = totalPL >= 0 ? 'var(--green)' : 'var(--red)';
  const plStr = (totalPL >= 0 ? '+' : '') + '$' + Math.abs(totalPL).toFixed(2);

  document.getElementById('log-summary').innerHTML = `
    <div class="stat-card"><div class="big-num">${log.length}</div><div class="label">TOTAL BETS</div></div>
    <div class="stat-card"><div class="big-num" style="color:${rateColor}">${rate}%</div><div class="label">HIT RATE</div></div>
    <div class="stat-card"><div class="big-num" style="color:var(--green)">${wins}</div><div class="label">WINS</div></div>
    <div class="stat-card" style="grid-column:span 3"><div class="big-num" style="color:${plColor};font-size:24px">${plStr}</div><div class="label">TOTAL P/L</div></div>
  `;
}

function toggleMoneylinePick(val) {
  const isML = val === 'MONEYLINE';
  document.getElementById('moneyline-pick-wrap').style.display = isML ? 'block' : 'none';
  document.getElementById('line-field-wrap').style.display = isML ? 'none' : 'block';
  if (isML) document.getElementById('logLine').value = '';
}

// Edit state
let editingId = null;

function deleteLog(id) {
  const log = getLog().filter(e => e.id !== id);
  saveLog(log);
  renderLogSummary();
  renderLogHistory();
}

function editLog(id) {
  const log = getLog();
  const entry = log.find(e => e.id === id);
  if (!entry) return;
  editingId = id;
  document.getElementById('logA').value = entry.gamerA;
  document.getElementById('logB').value = entry.gamerB;
  document.getElementById('logLine').value = entry.line;
  document.getElementById('logBet').value = entry.bet;
  document.getElementById('logWager').value = entry.wager || '';
  document.getElementById('logPayout').value = entry.payout || '';
  document.getElementById('logResult').value = entry.result;
  document.getElementById('logNotes').value = entry.notes || '';
  if (entry.bet === 'MONEYLINE') {
    document.getElementById('moneyline-pick-wrap').style.display = 'block';
    document.getElementById('logPick').value = entry.pick || '';
  } else {
    document.getElementById('moneyline-pick-wrap').style.display = 'none';
  }
  document.querySelector('.btn-accent').textContent = '✓ SAVE EDIT';
  document.querySelector('.btn-accent').style.borderColor = 'var(--yellow)';
  document.querySelector('.btn-accent').style.color = 'var(--yellow)';
  window.scrollTo(0, document.getElementById('tab-log').offsetTop);
}

function addLog() {
  const a = document.getElementById('logA').value.trim();
  const b = document.getElementById('logB').value.trim();
  const line = document.getElementById('logLine').value.trim();
  if (!a || !b || !line) return;
  const wager = parseFloat(document.getElementById('logWager').value) || 0;
  const payout = parseFloat(document.getElementById('logPayout').value) || 0;
  const bet = document.getElementById('logBet').value;
  const entry = {
    id: editingId || Date.now(),
    gamerA: a, gamerB: b, line,
    bet,
    pick: bet === 'MONEYLINE' ? document.getElementById('logPick').value.trim() : '',
    result: document.getElementById('logResult').value,
    notes: document.getElementById('logNotes').value.trim(),
    wager, payout,
    date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit', hour12: true, timeZoneName: 'short'})
  };
  let log = getLog();
  if (editingId) {
    log = log.map(e => e.id === editingId ? entry : e);
    editingId = null;
    document.querySelector('.btn-accent').textContent = '+ ADD TO LOG';
    document.querySelector('.btn-accent').style.borderColor = 'var(--accent)';
    document.querySelector('.btn-accent').style.color = 'var(--accent)';
  } else {
    log = [entry, ...log];
  }
  saveLog(log);
  document.getElementById('logA').value = '';
  document.getElementById('logB').value = '';
  document.getElementById('logLine').value = '';
  document.getElementById('logWager').value = '';
  document.getElementById('logPayout').value = '';
  document.getElementById('logNotes').value = '';
  document.getElementById('logPick').value = '';
  document.getElementById('moneyline-pick-wrap').style.display = 'none';
  renderLogSummary();
  renderLogHistory();
}

function renderLogHistory() {
  let log = getLog();
  const el = document.getElementById('log-history');
  const searchEl = document.getElementById('logSearch');
  const q = searchEl ? searchEl.value.toLowerCase().trim() : '';
  if (q) log = log.filter(e => 
    e.gamerA.toLowerCase().includes(q) || 
    e.gamerB.toLowerCase().includes(q) ||
    (e.pick && e.pick.toLowerCase().includes(q))
  );
  if (!log.length) { el.innerHTML = q ? '<div style="color:var(--muted);font-size:12px;padding:12px 0;text-align:center;letter-spacing:2px">NO RESULTS</div>' : ''; return; }
  const resultColor = r => r === 'WIN' ? 'var(--green)' : r === 'LOSS' ? 'var(--red)' : r === 'CASHED OUT' ? '#00bfff' : 'var(--yellow)';
  el.innerHTML = `<div class="card"><div class="section-title">HISTORY</div>` +
    log.map(e => {
      const pl = e.result === 'WIN' && e.payout && e.wager ? '+'+'$'+(e.payout - e.wager).toFixed(2)
                : e.result === 'LOSS' && e.wager ? '-$'+e.wager.toFixed(2) : '';
      const plColor = pl.startsWith('+') ? 'var(--green)' : pl.startsWith('-') ? 'var(--red)' : 'var(--muted)';
      return `
      <div class="log-entry">
        <div class="log-entry-left">${e.gamerA} vs ${e.gamerB}<span class="log-entry-date">${e.date}</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px">
          <span class="tag" style="background:rgba(100,100,150,0.15);border:1px solid #333;color:var(--dim)">${e.bet === 'MONEYLINE' ? 'ML · '+(e.pick||'?') : e.bet+' '+e.line}</span>
          <span class="tag" style="background:${resultColor(e.result)}22;border:1px solid ${resultColor(e.result)}44;color:${resultColor(e.result)}">${e.result}</span>
          ${e.wager ? `<span style="color:var(--muted);font-size:11px">$${(+e.wager).toFixed(2)} → $${e.payout ? (+e.payout).toFixed(2) : '?'}</span>` : ''}
          ${pl ? `<span style="color:${plColor};font-size:12px;font-weight:bold">${pl}</span>` : ''}
          ${e.notes ? `<span style="color:var(--muted);font-size:11px">${e.notes}</span>` : ''}
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button onclick="editLog(${e.id})" style="background:none;border:1px solid var(--muted);color:var(--muted);font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;padding:3px 10px;border-radius:2px;cursor:pointer">EDIT</button>
          <button onclick="deleteLog(${e.id})" style="background:none;border:1px solid var(--red);color:var(--red);font-family:'Courier New',monospace;font-size:10px;letter-spacing:1px;padding:3px 10px;border-radius:2px;cursor:pointer">DELETE</button>
        </div>
      </div>`;
    }).join('') + `</div>`;
}

// ── LINE ANALYZER ────────────────────────────────────────────────────────────
function analyzeeLine() {
  const line = parseFloat(document.getElementById('hrLine').value);
  const el = document.getElementById('line-verdict');
  if (!dataA || !dataB || isNaN(line)) { el.innerHTML = ''; return; }
  const combined = dataA.ppg + dataB.ppg;
  const diff = combined - line;
  const absDiff = Math.abs(diff);

  let label, color, detail;
  if (diff > 12) {
    label = '🔥 OVER VALUE';
    color = 'var(--green)';
    detail = `Line is ${absDiff.toFixed(1)} pts BELOW avg — book set it low`;
  } else if (diff > 5) {
    label = '✓ LEAN OVER';
    color = 'var(--green)';
    detail = `Avg output ${absDiff.toFixed(1)} pts above the line`;
  } else if (diff < -12) {
    label = '🔥 UNDER VALUE';
    color = 'var(--red)';
    detail = `Line is ${absDiff.toFixed(1)} pts ABOVE avg — book set it high`;
  } else if (diff < -5) {
    label = '✓ LEAN UNDER';
    color = 'var(--red)';
    detail = `Avg output ${absDiff.toFixed(1)} pts below the line`;
  } else {
    label = '⚡ SHARP LINE';
    color = 'var(--yellow)';
    detail = `Line within ${absDiff.toFixed(1)} pts of avg — use form & movement`;
  }

  el.innerHTML = `
    <div style="color:${color};font-size:14px;font-weight:bold;letter-spacing:1px">${label}</div>
    <div style="color:var(--dim);font-size:11px;margin-top:3px">${detail}</div>
    <div style="color:var(--muted);font-size:10px;margin-top:2px">Avg: ${combined.toFixed(1)} · Line: ${line}</div>`;
}

init();
</script>
